[package]
name = "ble_server"
version = "0.1.0"
edition = "2021"

[dependencies]
# BLE stack (WinRT backend auto-selected on Windows)
btleplug = "0.11"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
futures = "0.3"

# MCP 传输：HTTP + SSE
axum = "0.7"

# Serialization for MCP JSON-RPC
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
anyhow = "1"

# UUID parsing
uuid = { version = "1", features = ["v4"] }

# GUI: eframe / egui（跨平台即时渲染，替代原生 Win32 手搓）
# 用 glow(OpenGL) 后端：默认的 wgpu 后端在本机 windows crate 版本下编译不过
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }

# Logging
env_logger = "0.11"
log = "0.4"

[profile.release]
opt-level = 2
